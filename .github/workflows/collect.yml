name: collect

# Runs the news + YouTube collectors every 30 minutes, commits new raw data
# back to the repo. This is deliberately simple (commit-as-storage) rather
# than a real database, because the goal right now is "data keeps flowing
# even when nobody's laptop is on" — swap this out once you have Phase 2/3
# infrastructure worth building instead.
#
# Reddit is deferred — see docs/roadmap.md. The Reddit step below is
# commented out rather than left failing every run; uncomment it and add
# the three Reddit secrets once/if API approval comes through.
#
# Setup required (GitHub repo Settings > Secrets and variables > Actions):
#   YOUTUBE_API_KEY
# News RSS needs no secret — feeds.txt is read directly.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser google-api-python-client python-dotenv

      - name: Run news RSS collector
        run: python ingestion/news_rss.py
        continue-on-error: true  # one collector failing shouldn't block the other

      - name: Run YouTube collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python ingestion/youtube_collector.py
        continue-on-error: true

      # Reddit — deferred, see docs/roadmap.md. Uncomment when ready:
      #
      # - name: Install Reddit dependency
      #   run: pip install praw
      #
      # - name: Run Reddit collector
      #   env:
      #     REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      #     REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      #     REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      #   run: python ingestion/reddit_collector.py
      #   continue-on-error: true

      - name: Commit new data
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/raw/
          git diff --staged --quiet || git commit -m "data: scheduled collection $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
